<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1600 900"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true">

    <defs>

        <!-- ======================================================
             SKY
        ======================================================= -->

        <linearGradient
            id="skyGradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1">

            <stop offset="0%" stop-color="#0E2328"/>
            <stop offset="35%" stop-color="#1B3B39"/>
            <stop offset="70%" stop-color="#4C6857"/>
            <stop offset="100%" stop-color="#6F836D"/>

        </linearGradient>

        <!-- ======================================================
             HAZE
        ======================================================= -->

        <linearGradient
            id="hazeGradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1">

            <stop offset="0%"
                  stop-color="rgba(255,255,255,0)"/>

            <stop offset="100%"
                  stop-color="rgba(255,255,255,.15)"/>

        </linearGradient>

        <!-- ======================================================
             SOIL
        ======================================================= -->

        <linearGradient
            id="soilGradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1">

            <stop offset="0%" stop-color="#43372B"/>
            <stop offset="45%" stop-color="#2D241C"/>
            <stop offset="100%" stop-color="#17120F"/>

        </linearGradient>

    </defs>

    <!-- ====================================================== -->
    <!-- SKY -->
    <!-- ====================================================== -->

    <g id="sky">

        <rect
            width="1600"
            height="900"
            fill="url(#skyGradient)" />

    </g>

    <!-- ====================================================== -->
    <!-- HAZE -->
    <!-- ====================================================== -->

    <g id="haze">

        <rect
            x="0"
            y="260"
            width="1600"
            height="280"
            fill="url(#hazeGradient)"
            opacity=".35"/>

    </g>

    <!-- ====================================================== -->
    <!-- BACK MOUNTAINS -->
    <!-- ====================================================== -->

    <g id="mountains-back">

        <path
            d="
            M0 520
            L180 470
            L360 500
            L620 390
            L910 470
            L1180 360
            L1600 430
            L1600 900
            L0 900
            Z"
            fill="#30473D"
            opacity=".35"/>

    </g>

    <!-- ====================================================== -->
    <!-- MID MOUNTAINS -->
    <!-- ====================================================== -->

    <g id="mountains-mid">

        <path
            d="
            M0 610
            L200 545
            L430 585
            L690 475
            L910 560
            L1170 455
            L1400 520
            L1600 470
            L1600 900
            L0 900
            Z"
            fill="#456053"
            opacity=".65"/>

    </g>

    <!-- ====================================================== -->
    <!-- FRONT MOUNTAINS -->
    <!-- ====================================================== -->

    <g id="mountains-front">

        <path
            d="
            M0 690
            L160 645
            L420 680
            L690 615
            L950 665
            L1220 620
            L1460 650
            L1600 635
            L1600 900
            L0 900
            Z"
            fill="#627A63"/>

    </g>

    <!-- ====================================================== -->
    <!-- PRAIRIE -->
    <!-- ====================================================== -->

    <g id="prairie">

        <!-- Filled dynamically by PrairieGenerator -->

    </g>

    <!-- ====================================================== -->
    <!-- OAK SILHOUETTES -->
    <!-- ====================================================== -->

    <g
        id="oaks"
        opacity=".45">

        <!-- Reserved for future procedural tree generator -->

    </g>

    <!-- ====================================================== -->
    <!-- SOIL SURFACE -->
    <!-- ====================================================== -->

    <g id="soil">

        <rect
            x="0"
            y="760"
            width="1600"
            height="140"
            fill="url(#soilGradient)" />

    </g>

    <!-- ====================================================== -->
    <!-- ROOT SYSTEM -->
    <!-- ====================================================== -->

    <g
        id="roots"
        fill="none"
        stroke="#8B7355"
        stroke-width="2"
        stroke-linecap="round">

        <!-- Generated later -->

    </g>

    <!-- ====================================================== -->
    <!-- MYCORRHIZAL NETWORK -->
    <!-- ====================================================== -->

    <g
        id="hyphae"
        fill="none"
        stroke="#CBBF92"
        stroke-width=".75"
        opacity=".45">

        <!-- Generated later -->

    </g>

</svg>