<section
    id="observation-deck"
    class="station observation-deck"
    data-station="observation-deck">

    <!-- ====================================================== -->
    <!-- Observation Deck Header -->
    <!-- ====================================================== -->

    <header class="deck-header">

        <div class="dome-shell">

            <div class="dome-sky"></div>

            <div class="dome-grid"></div>

            <div class="morning-light"></div>

        </div>

        <div class="deck-title">

            <p class="museum-label">

                FIELD STATION

            </p>

            <h1>

                Observation Deck

            </h1>

            <p class="deck-introduction">

                Begin each expedition by studying the landscape,
                reviewing current ecological conditions,
                and preparing for work in the field.

            </p>

        </div>

    </header>

    <!-- ====================================================== -->
    <!-- Main Interior -->
    <!-- ====================================================== -->

    <div class="deck-room">

        <!-- ================================================== -->
        <!-- GIS Wall -->
        <!-- ================================================== -->

        <aside class="gis-wall">

            <h2>GIS Wall</h2>

            <div class="map-board">

                <div class="map-pin">
                    Wright's Field
                </div>

                <div class="map-pin">
                    CSUSM Milpa
                </div>

                <div class="map-pin">
                    Ancient Agricultural Terraces
                </div>

                <div class="map-pin">
                    Joshua Tree
                </div>

                <div class="map-pin">
                    Restoration Sites
                </div>

            </div>

        </aside>

        <!-- ================================================== -->
        <!-- Observation Window -->
        <!-- ================================================== -->

        <section class="window-wall">

            <div class="window-header">

                Observation Window

            </div>

            <div class="window-frame">

                <div class="window-columns">

                    <div class="column left"></div>

                    <div class="column right"></div>

                </div>

                <div id="window-landscape">

                    <div class="sky-layer"></div>

                    <div class="mountain-layer"></div>

                    <div class="prairie-layer"></div>

                </div>

                <div id="weather-layer"></div>

                <div class="glass-reflections"></div>

            </div>

        </section>

    </div>

    <!-- ====================================================== -->
    <!-- Research Bench -->
    <!-- ====================================================== -->

    <footer class="workbench">

        <div class="bench-surface">

            <button
                class="station-tool"
                id="tool-notebook">

                📓

                <span>

                    Field Notebook

                </span>

            </button>

            <button
                class="station-tool"
                id="tool-laboratory">

                🧪

                <span>

                    Laboratory

                </span>

            </button>

            <button
                class="station-tool"
                id="tool-field">

                🧭

                <span>

                    Explore the Field

                </span>

            </button>

        </div>

    </footer>

</section>
